<body>
  <div class="container">
    <div class="calculator">
      <h2>Age Calculator</h2>

      <label for="date">Age at date :  </label>
      <input type="date" id="date" >
      </div>
    <button onclick="calculateAge()" class="calc">Calculate Age</button>
    <p class="Age">Age is 1 yaer 11 months and 22 days .</p>
  </div>
  </div>
  <script src="script.js"></script>
</body>
